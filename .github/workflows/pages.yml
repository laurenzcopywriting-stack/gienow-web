name: Auf GitHub Pages veroeffentlichen

on:
  push:
    branches: [main]
  # Erlaubt das Ausloesen von Hand im Actions-Tab.
  workflow_dispatch:

# Der Deploy braucht Schreibrechte auf Pages und ein OIDC-Token.
permissions:
  contents: read
  pages: write
  id-token: write

# Laeuft ein Deploy bereits, wird er nicht abgebrochen — sonst koennte eine
# halb ausgelieferte Seite stehen bleiben.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Frueher zwei Jobs: einer baute die Seite, der zweite lieferte sie aus.
  # Seit dem Umzug auf Netlify wird hier nichts mehr gebaut — Netlify baut
  # selbst aus diesem Repo mit `npm run build` und BASE_PFAD=/ (netlify.toml).
  # Von hier geht nur noch `weiterleitung/` nach oben, damit jede alte Adresse
  # zur neuen fuehrt statt eine zweite, nicht mehr gepflegte Fassung
  # auszuliefern. Ein Job genuegt dafuer.
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: weiterleitung

      - uses: actions/deploy-pages@v4
        id: deploy
